# ============================================
# ResourceManager - Docker Compose (Local Development)
# ============================================
# Usage:
#   docker-compose up --build        # Build and start all services
#   docker-compose up -d             # Start in background
#   docker-compose down              # Stop all services
#   docker-compose logs -f api       # Follow API logs
# ============================================

services:
  # ============================================
  # Backend API (.NET 8)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ResourceManager-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Database (Supabase-hosted - no local container needed)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      # JWT Configuration
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-MyAwesomeApp}
      - Jwt__Audience=${JWT_AUDIENCE:-MyAwesomeUsers}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-100}
      # Supabase
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__Key=${SUPABASE_KEY}
      # Google Integration
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__RefreshToken=${GOOGLE_REFRESH_TOKEN}
      # Auth0 (for future OIDC)
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__ClientId=${AUTH0_CLIENT_ID}
      - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET}
      - Auth0__Audience=${AUTH0_AUDIENCE}
    volumes:
      - ./Logs:/app/Logs  # Persist logs locally
    networks:
      - ResourceManager-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Frontend (React + Vite + Nginx)
  # ============================================
  web:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: ResourceManager-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ResourceManager-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ResourceManager-network:
    driver: bridge

# ============================================
# Volume Notes:
# - No database volume needed (using Supabase-hosted PostgreSQL)
# - Logs are persisted to local ./Logs directory
# ============================================
