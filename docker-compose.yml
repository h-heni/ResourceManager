# ============================================
# ResourceManager - Docker Compose (Production / VPS)
# ============================================
# Usage:
#   docker compose up -d              # Start all services (detached)
#   docker compose down               # Stop all services
#   docker compose logs -f api        # Follow API logs
#   docker compose ps                 # List running services
#
# IMPORTANT: Create a .env file from .env.example before running!
#
# Memory budget (2GB VPS):
#   PostgreSQL: ~512MB | API: ~512MB | Web: ~64MB | OS: ~900MB
# ============================================

services:
  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: resourcemanager-redis
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resourcemanager}
      POSTGRES_USER: ${POSTGRES_USER:-rmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No ports exposed — only accessible from the internal network
    # PostgreSQL tuning for 2GB VPS (512MB budget for PG)
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=256MB
      -c max_connections=50
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=256MB
      -c min_wal_size=64MB
      -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmuser} -d ${POSTGRES_DB:-resourcemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Backend API (.NET 8)
  # ============================================
  api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resourcemanager-api
    ports:
      - "7175:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # .NET GC tuning for low-memory VPS (use Workstation GC, not Server GC)
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimit=0x1A000000
      # Connection string — uses container name 'postgres_db' as host
      - CONNECTION_STRING=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer;Maximum Pool Size=20;Minimum Pool Size=2;Connection Idle Lifetime=60
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer;Maximum Pool Size=20;Minimum Pool Size=2;Connection Idle Lifetime=60
      # JWT Configuration
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-ResourceManager}
      - Jwt__Audience=${JWT_AUDIENCE:-ResourceManager-Users}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-100}
      # Email Configuration (Local SMTP)
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-mail.rscmanager.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@rscmanager.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Resource Manager}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      # Redis Configuration
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?err},abortConnect=false
      - Redis__InstanceName=ResourceManager_
      # Auth0 — temporarily disabled (HTTP deployment)
      # - Auth0__Domain=${AUTH0_DOMAIN:-}
      # - Auth0__ClientId=${AUTH0_CLIENT_ID:-}
      # - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET:-}
      # - Auth0__Audience=${AUTH0_AUDIENCE:-}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - api-logs:/app/Logs
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Frontend (React + Nginx reverse proxy)
  # ============================================
  web:
    image: ${WEB_IMAGE:-resourcemanager-web:latest}
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        # VITE_GOOGLE_CLIENT_ID removed — Google OAuth temporarily disabled
    container_name: resourcemanager-web
    environment:
      - BACKEND_API_HOST=api
      - BACKEND_API_PORT=8080
    ports:
      - "${WEB_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  api-logs:
    driver: local

networks:
  rm-internal:
    driver: bridge
