# ============================================
# ResourceManager - Docker Compose (Production / VPS)
# ============================================
# Usage:
#   docker compose up -d              # Start all services (detached)
#   docker compose down               # Stop all services
#   docker compose logs -f api        # Follow API logs
#   docker compose ps                 # List running services
#
# IMPORTANT: Create a .env file from .env.example before running!
# ============================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resourcemanager}
      POSTGRES_USER: ${POSTGRES_USER:-rmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No ports exposed — only accessible from the internal network
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmuser} -d ${POSTGRES_DB:-resourcemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Backend API (.NET 8)
  # ============================================
  api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resourcemanager-api
    # No ports exposed — only the frontend (nginx) can reach it via the internal network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Connection string — uses container name 'postgres_db' as host
      - CONNECTION_STRING=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer
      # JWT Configuration
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-ResourceManager}
      - Jwt__Audience=${JWT_AUDIENCE:-ResourceManager-Users}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-100}
      # Google Integration (Gmail API for email sending — NOT for OAuth)
      - GoogleOptions__ClientId=${GOOGLE_CLIENT_ID:-}
      - GoogleOptions__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - GoogleOptions__RefreshToken=${GOOGLE_REFRESH_TOKEN:-}
      # Auth0 — temporarily disabled (HTTP deployment)
      # - Auth0__Domain=${AUTH0_DOMAIN:-}
      # - Auth0__ClientId=${AUTH0_CLIENT_ID:-}
      # - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET:-}
      # - Auth0__Audience=${AUTH0_AUDIENCE:-}
    volumes:
      - api-logs:/app/Logs
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Frontend (React + Nginx reverse proxy)
  # ============================================
  web:
    image: ${WEB_IMAGE:-resourcemanager-web:latest}
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        # VITE_GOOGLE_CLIENT_ID removed — Google OAuth temporarily disabled
    container_name: resourcemanager-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local
  api-logs:
    driver: local

networks:
  rm-internal:
    driver: bridge
