# =============================================================================
# Docker Compose - Load Testing Environment with Optimized PostgreSQL
# =============================================================================
# This is an enhanced version with PostgreSQL tuning for load testing
# Usage: docker compose -f load-testing/docker-compose.loadtest.yml up -d
# =============================================================================

version: '3.8'

services:
  # ============================================
  # PostgreSQL Database (Optimized for 2GB VPS)
  # ============================================
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db_loadtest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resourcemanager}
      POSTGRES_USER: ${POSTGRES_USER:-rmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loadtest123}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c track_io_timing=on
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
    volumes:
      - pgdata_loadtest:/var/lib/postgresql/data
    networks:
      - loadtest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmuser} -d ${POSTGRES_DB:-resourcemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # ============================================
  # Backend API (.NET 8) - Optimized
  # ============================================
  api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: resourcemanager-api-loadtest
    ports:
      - "7175:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - CONNECTION_STRING=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:-loadtest123};Pooling=true;Minimum Pool Size=5;Maximum Pool Size=50;Connection Lifetime=300;Connection Idle Lifetime=60
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:-loadtest123};Pooling=true;Minimum Pool Size=5;Maximum Pool Size=50;Connection Lifetime=300;Connection Idle Lifetime=60
      - Jwt__Key=${JWT_KEY:-ThisIsATestJwtKeyForLoadTestingOnly1234567890}
      - Jwt__Issuer=ResourceManager
      - Jwt__Audience=ResourceManager-Users
      - Jwt__TokenExpirationInMinutes=100
    volumes:
      - api-logs-loadtest:/app/Logs
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - loadtest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 896M
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  pgdata_loadtest:
    driver: local
  api-logs-loadtest:
    driver: local

networks:
  loadtest:
    driver: bridge
    name: rm-loadtest
