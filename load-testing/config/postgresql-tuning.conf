# =============================================================================
# PostgreSQL Configuration for 2GB VPS
# =============================================================================
# Copy relevant settings to your postgresql.conf or use via docker command
# docker-compose.yml example:
#   postgres_db:
#     command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB ...
# =============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# MEMORY CONFIGURATION (Total: 768MB dedicated to PostgreSQL)
# ──────────────────────────────────────────────────────────────────────────────

# Shared memory used for caching data
# Rule: 25% of dedicated PostgreSQL memory
shared_buffers = 256MB

# PostgreSQL's assumption about kernel disk caching
# Rule: 75% of dedicated PostgreSQL memory
effective_cache_size = 768MB

# Memory used for internal sort operations and hash tables
# Formula: (dedicated_mem / max_connections / 4)
# 768MB / 100 / 4 = 1.92MB ≈ 2621kB
work_mem = 2621kB

# Memory used for maintenance operations (VACUUM, CREATE INDEX, etc.)
# Rule: shared_buffers / 4, max 1GB
maintenance_work_mem = 64MB

# Memory for storing temporary tables
# Rule: work_mem * 2
temp_buffers = 8MB

# ──────────────────────────────────────────────────────────────────────────────
# CONNECTION SETTINGS
# ──────────────────────────────────────────────────────────────────────────────

# Maximum number of concurrent connections
# 2GB VPS: 100 is reasonable
max_connections = 100

# Connections reserved for superuser
superuser_reserved_connections = 3

# ──────────────────────────────────────────────────────────────────────────────
# WRITE AHEAD LOG (WAL)
# ──────────────────────────────────────────────────────────────────────────────

# Amount of memory used for WAL data buffering
# Rule: 3% of shared_buffers, between 32KB and 16MB
wal_buffers = 8MB

# Minimum size of WAL before archiving
min_wal_size = 1GB

# Maximum size of WAL before forced checkpoint
max_wal_size = 4GB

# Target completion time for checkpoints (0-1)
# 0.9 = complete checkpoint in 90% of time between checkpoints
checkpoint_completion_target = 0.9

# ──────────────────────────────────────────────────────────────────────────────
# QUERY PLANNER
# ──────────────────────────────────────────────────────────────────────────────

# Cost of fetching a random page
# SSD: 1.1, HDD: 4.0
random_page_cost = 1.1

# Number of concurrent disk I/O operations
# SSD: 200, HDD: 2
effective_io_concurrency = 200

# Amount of detail in statistics for query planning
# Higher = better plans, more analyze time
# Default: 100, can go to 10000 for critical tables
default_statistics_target = 100

# ──────────────────────────────────────────────────────────────────────────────
# MONITORING & LOGGING
# ──────────────────────────────────────────────────────────────────────────────

# Enable query statistics collection
shared_preload_libraries = 'pg_stat_statements'

# Track all statements (not just top-level)
pg_stat_statements.track = all

# Maximum number of statements tracked
pg_stat_statements.max = 10000

# Track I/O timing (slight overhead, but useful for diagnostics)
track_io_timing = on

# Track activity and function call counts
track_activities = on
track_counts = on
track_functions = all

# Size of query text tracked
track_activity_query_size = 2048

# Log slow queries (adjust threshold as needed)
log_min_duration_statement = 1000  # Log queries slower than 1 second

# Log connections and disconnections
log_connections = off
log_disconnections = off

# Log checkpoints (useful for tuning)
log_checkpoints = on

# ──────────────────────────────────────────────────────────────────────────────
# AUTOVACUUM (Automatic maintenance)
# ──────────────────────────────────────────────────────────────────────────────

# Enable autovacuum (should always be on)
autovacuum = on

# Maximum number of autovacuum workers
autovacuum_max_workers = 3

# Time delay between autovacuum runs
autovacuum_naptime = 1min

# Minimum number of row updates before vacuum
autovacuum_vacuum_threshold = 50

# Minimum number of row updates before analyze
autovacuum_analyze_threshold = 50

# Fraction of table size to add to vacuum threshold
autovacuum_vacuum_scale_factor = 0.2

# Fraction of table size to add to analyze threshold
autovacuum_analyze_scale_factor = 0.1

# ──────────────────────────────────────────────────────────────────────────────
# PERFORMANCE TUNING
# ──────────────────────────────────────────────────────────────────────────────

# Maximum memory for each parallel worker
# Should be 2-4x work_mem
max_parallel_workers_per_gather = 2

# Maximum number of parallel workers system-wide
max_parallel_workers = 4

# Maximum worker processes
max_worker_processes = 4

# ──────────────────────────────────────────────────────────────────────────────
# CONNECTION POOLING (Application Side - Connection String)
# ──────────────────────────────────────────────────────────────────────────────

# Add these to your .NET connection string:
# Pooling=true
# Minimum Pool Size=5
# Maximum Pool Size=50
# Connection Lifetime=300
# Connection Idle Lifetime=60

# ──────────────────────────────────────────────────────────────────────────────
# APPLY SETTINGS VIA DOCKER COMPOSE
# ──────────────────────────────────────────────────────────────────────────────

# Add to docker-compose.yml under postgres_db service:
#
# postgres_db:
#   image: postgres:16-alpine
#   command: >
#     postgres
#     -c shared_buffers=256MB
#     -c effective_cache_size=768MB
#     -c maintenance_work_mem=64MB
#     -c checkpoint_completion_target=0.9
#     -c wal_buffers=8MB
#     -c default_statistics_target=100
#     -c random_page_cost=1.1
#     -c effective_io_concurrency=200
#     -c work_mem=2621kB
#     -c min_wal_size=1GB
#     -c max_wal_size=4GB
#     -c max_connections=100
#     -c shared_preload_libraries=pg_stat_statements
#     -c pg_stat_statements.track=all
#     -c track_io_timing=on
#     -c log_min_duration_statement=1000
#     -c log_checkpoints=on

# ──────────────────────────────────────────────────────────────────────────────
# VERIFICATION
# ──────────────────────────────────────────────────────────────────────────────

# After applying, verify settings:
# docker compose exec postgres_db psql -U rmuser -d resourcemanager -c "SHOW shared_buffers;"
# docker compose exec postgres_db psql -U rmuser -d resourcemanager -c "SHOW effective_cache_size;"
# docker compose exec postgres_db psql -U rmuser -d resourcemanager -c "SHOW max_connections;"
