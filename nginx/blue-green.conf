# ============================================
# Nginx Blue-Green Deployment Configuration
# ============================================
# Routes all traffic to the ACTIVE environment only.
# Only the active environment's containers need to be running.
#
# Variables (replaced by envsubst at container startup):
#   ACTIVE_ENV       - "blue" or "green"
#   ACTIVE_API_HOST  - Active API container hostname (e.g., blue-api)
#   ACTIVE_API_PORT  - Active API port (e.g., 8080)
#   ACTIVE_WEB_HOST  - Active Web container hostname (e.g., blue-web)
#   ACTIVE_WEB_PORT  - Active Web port (e.g., 80)
#
# Traffic Switching:
#   1. Update ACTIVE_ENV, ACTIVE_API_HOST, ACTIVE_WEB_HOST in .env
#   2. Recreate nginx: docker compose up -d --force-recreate nginx
#   (envsubst re-runs at startup to generate fresh config)
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker DNS resolver — resolves container hostnames at request time
    # (not config load time), so nginx starts even if backends aren't ready yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml application/javascript
               application/json;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deployment environment header (for debugging)
    add_header X-Deployment-Env "${ACTIVE_ENV}" always;

    # Max upload size (for PDF uploads, invoice attachments)
    client_max_body_size 25M;

    # Buffer settings for better performance
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeout settings
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # ============================================
    # Health Check Endpoint (Nginx itself — no backend dependency)
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy - active: ${ACTIVE_ENV}\n";
        add_header Content-Type text/plain;
        add_header X-Active-Environment "${ACTIVE_ENV}" always;
    }

    # ============================================
    # API Proxy — route to active API container
    # ============================================
    # Uses nginx variable so DNS is resolved at request time (via resolver)
    # instead of config load time — prevents startup failure if API isn't ready
    location /api/ {
        set $api_backend ${ACTIVE_API_HOST}:${ACTIVE_API_PORT};
        proxy_pass http://$api_backend;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;

        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
    }

    # ============================================
    # Swagger UI Proxy (Optional — remove in hardened prod)
    # ============================================
    location /swagger {
        set $api_backend ${ACTIVE_API_HOST}:${ACTIVE_API_PORT};
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Frontend — route to active Web container
    # ============================================
    location / {
        set $web_backend ${ACTIVE_WEB_HOST}:${ACTIVE_WEB_PORT};
        proxy_pass http://$web_backend;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache control for HTML (no cache)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ============================================
    # Error Pages
    # ============================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 '{"error": "Service temporarily unavailable", "active_env": "${ACTIVE_ENV}"}';
        add_header Content-Type application/json;
    }

    error_page 500 /500.html;
    location = /500.html {
        internal;
        return 500 '{"error": "Internal server error", "active_env": "${ACTIVE_ENV}"}';
        add_header Content-Type application/json;
    }
}