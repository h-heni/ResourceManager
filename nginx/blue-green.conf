# ============================================
# Nginx Blue-Green Reverse Proxy
# ============================================
# This template is processed by envsubst at container startup.
# ACTIVE_ENV is substituted to "blue" or "green".
#
# Only the ACTIVE environment's containers need to be running.
# To switch: update ACTIVE_ENV in .env → recreate nginx container.
# ============================================

upstream active_api {
    server ${ACTIVE_ENV}-api:8080;
}

upstream active_web {
    server ${ACTIVE_ENV}-web:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (PDFs, invoice attachments)
    client_max_body_size 25M;

    # Proxy buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Proxy timeouts
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # ── Health check (nginx itself) ──
    location /health {
        access_log off;
        return 200 "healthy - active: ${ACTIVE_ENV}\n";
        add_header Content-Type text/plain;
    }

    # ── API health check (HealthController uses /health, not /api/health) ──
    location = /api/health {
        proxy_pass http://active_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API proxy → active backend ──
    location /api/ {
        proxy_pass http://active_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Swagger UI → active backend ──
    location /swagger {
        proxy_pass http://active_api/swagger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend → active web ──
    location / {
        proxy_pass http://active_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cache for HTML (React SPA)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Error pages ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
