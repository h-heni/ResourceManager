# ============================================
# Nginx Blue-Green Deployment Configuration
# ============================================
# This configuration dynamically routes traffic to either
# Blue or Green environment based on the ACTIVE_ENV variable.
#
# Environment Variables:
#   ACTIVE_ENV - "blue" or "green" (determines active upstream)
#   BLUE_API_HOST - Blue API container name
#   BLUE_API_PORT - Blue API port
#   BLUE_WEB_HOST - Blue Web container name
#   BLUE_WEB_PORT - Blue Web port
#   GREEN_API_HOST - Green API container name
#   GREEN_API_PORT - Green API port
#   GREEN_WEB_HOST - Green Web container name
#   GREEN_WEB_PORT - Green Web port
#
# Traffic Switching:
#   1. Update ACTIVE_ENV in .env file
#   2. Run: docker exec nginx nginx -s reload
#   3. Nginx hot-reloads (< 0.1s downtime)
# ============================================

# ============================================
# Upstream Definitions (Dynamic based on ACTIVE_ENV)
# ============================================

# Blue API upstream
upstream blue_api {
    server ${BLUE_API_HOST}:${BLUE_API_PORT} max_fails=3 fail_timeout=30s;
}

# Blue Web upstream
upstream blue_web {
    server ${BLUE_WEB_HOST}:${BLUE_WEB_PORT} max_fails=3 fail_timeout=30s;
}

# Green API upstream
upstream green_api {
    server ${GREEN_API_HOST}:${GREEN_API_PORT} max_fails=3 fail_timeout=30s;
}

# Green Web upstream
upstream green_web {
    server ${GREEN_WEB_HOST}:${GREEN_WEB_PORT} max_fails=3 fail_timeout=30s;
}

# ============================================
# Active API upstream (selected by ACTIVE_ENV)
# ============================================
map $active_env $active_api_upstream {
    "blue"  "blue_api";
    "green" "green_api";
    default "blue_api";
}

# ============================================
# Active Web upstream (selected by ACTIVE_ENV)
# ============================================
map $active_env $active_web_upstream {
    "blue"  "blue_web";
    "green" "green_web";
    default "blue_web";
}

# Set active environment from env variable
# This is a workaround since nginx doesn't directly support env variables in upstream blocks
geo $active_env {
    default "${ACTIVE_ENV}";
}

# ============================================
# Main Server Block
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Deployment environment header (for debugging)
    add_header X-Deployment-Env "${ACTIVE_ENV}" always;

    # Max upload size (for PDF uploads, invoice attachments)
    client_max_body_size 25M;

    # Buffer settings for better performance
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeout settings
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # ============================================
    # Health Check Endpoint (Nginx itself)
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy - active: ${ACTIVE_ENV}\n";
        add_header Content-Type text/plain;
        add_header X-Active-Environment "${ACTIVE_ENV}" always;
    }

    # ============================================
    # API Proxy - Routes to active environment
    # ============================================
    location /api/ {
        # Determine which upstream based on ACTIVE_ENV
        set $backend_api "${ACTIVE_ENV}_api";
        
        # Proxy to active API environment
        proxy_pass http://${backend_api}/api/;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
    }

    # ============================================
    # Swagger UI Proxy (Optional - remove in hardened prod)
    # ============================================
    location /swagger {
        set $backend_api "${ACTIVE_ENV}_api";
        proxy_pass http://${backend_api}/swagger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Static Assets from Active Web Environment
    # ============================================
    location / {
        # Route to active web environment
        set $backend_web "${ACTIVE_ENV}_web";
        proxy_pass http://${backend_web};
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache control for HTML (no cache)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ============================================
    # Error Pages
    # ============================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 '{"error": "Service temporarily unavailable", "active_env": "${ACTIVE_ENV}"}';
        add_header Content-Type application/json;
    }

    error_page 500 /500.html;
    location = /500.html {
        internal;
        return 500 '{"error": "Internal server error", "active_env": "${ACTIVE_ENV}"}';
        add_header Content-Type application/json;
    }
}

# ============================================
# Additional Server Block for Environment Testing
# ============================================
# This allows direct access to specific environments for testing
# Comment out in production for security

server {
    listen 8090;
    server_name _;
    
    location / {
        return 200 "Blue Environment Test\n";
        add_header Content-Type text/plain;
    }
    
    location /api/ {
        proxy_pass http://blue_api/api/;
        proxy_set_header Host $host;
    }
    
    location /health {
        proxy_pass http://blue_api/health;
    }
}

server {
    listen 8091;
    server_name _;
    
    location / {
        return 200 "Green Environment Test\n";
        add_header Content-Type text/plain;
    }
    
    location /api/ {
        proxy_pass http://green_api/api/;
        proxy_set_header Host $host;
    }
    
    location /health {
        proxy_pass http://green_api/health;
    }
}
