# ============================================
# ResourceManager - Production Nginx Reverse Proxy
# Domain: rscmanager.com
# SSL enabled with custom certificates
# ============================================

# Run as non-root user
user nginx;

# Worker processes - auto-detect CPU cores
worker_processes auto;

# Error log
error_log /var/log/nginx/error.log warn;

# PID file
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide nginx version
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 25M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
    gzip_disable "msie6";
    gzip_min_length 256;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Upstream definitions for load balancing readiness
    upstream api_backend {
        server api:8080;
        keepalive 32;
    }

    upstream web_frontend {
        server web:80;
        keepalive 16;
    }

    # ============================================
    # HTTP → HTTPS REDIRECT (Port 80)
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name rscmanager.com www.rscmanager.com;

        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint (for load balancers)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # HTTPS Server (Port 443) - rscmanager.com
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rscmanager.com www.rscmanager.com;

        # ═══════════════════════════════════════════════════════════
        # SSL CERTIFICATE CONFIGURATION
        # ═══════════════════════════════════════════════════════════
        # Option 1: Let's Encrypt certificates
        # ssl_certificate /etc/letsencrypt/live/rscmanager.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/rscmanager.com/privkey.pem;
        # ssl_trusted_certificate /etc/letsencrypt/live/rscmanager.com/chain.pem;
        
        # Option 2: Custom certificates (place your certs here)
        ssl_certificate /etc/ssl/rscmanager.com.crt;
        ssl_certificate_key /etc/ssl/rscmanager.com.key;
        # If you have a CA bundle/chain:
        # ssl_trusted_certificate /etc/ssl/ca-bundle.crt;

        # ═══════════════════════════════════════════════════════════
        # SSL CONFIGURATION (Mozilla Intermediate - TLS 1.2+)
        # ═══════════════════════════════════════════════════════════
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session configuration
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (improves SSL handshake performance)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Diffie-Hellman parameter for DHE ciphersuites (generate with: openssl dhparam -out dhparam.pem 2048)
        # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # ═══════════════════════════════════════════════════════════
        # SECURITY HEADERS
        # ═══════════════════════════════════════════════════════════
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()" always;

        # Content Security Policy (adjust as needed for your app)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://rscmanager.com;" always;

        # ═══════════════════════════════════════════════════════════
        # HEALTH CHECK ENDPOINT
        # ═══════════════════════════════════════════════════════════
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ═══════════════════════════════════════════════════════════
        # API PROXY - Route /api/* to backend container
        # ═══════════════════════════════════════════════════════════
        location /api/ {
            # Rate limiting for API (100 req/min with burst of 20)
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy to backend API
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Essential proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Proxy configuration
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;
            proxy_buffering off;
            
            # Timeouts for long-running operations (PDF generation, etc.)
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # ═══════════════════════════════════════════════════════════
        # AUTH ENDPOINTS - Stricter rate limiting
        # ═══════════════════════════════════════════════════════════
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            
            proxy_pass http://api_backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ═══════════════════════════════════════════════════════════
        # SWAGGER UI - Disable in production (404) or enable for debugging
        # ═══════════════════════════════════════════════════════════
        location /swagger {
            # PRODUCTION: Return 404 to hide API documentation
            return 404;
            
            # STAGING/DEBUG: Uncomment below to enable
            # proxy_pass http://api_backend/swagger;
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-Proto https;
        }

        # ═══════════════════════════════════════════════════════════
        # FRONTEND - Route everything else to React app
        # ═══════════════════════════════════════════════════════════
        location / {
            # Rate limiting for general traffic
            limit_req zone=general_limit burst=50 nodelay;
            
            # Proxy to frontend container
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Proxy settings
            proxy_redirect off;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ═══════════════════════════════════════════════════════════
        # STATIC ASSET CACHING
        # ═══════════════════════════════════════════════════════════
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ═══════════════════════════════════════════════════════════
        # ERROR PAGES
        # ═══════════════════════════════════════════════════════════
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
