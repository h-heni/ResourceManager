# ═══════════════════════════════════════════════════════════════
# Nginx reverse-proxy configuration for rscmanager.com
# SSL termination → Docker nginx (blue-green) on port 8888
# ═══════════════════════════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Redirect HTTP → HTTPS (all domains) ──
server {
    listen 80;
    listen [::]:80;
    server_name rscmanager.com www.rscmanager.com;

    # ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rscmanager.com$request_uri;
    }
}

# ── Redirect www → apex (HTTPS) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rscmanager.com;

    ssl_certificate     /etc/ssl/rscmanager/fullchain.pem;
    ssl_certificate_key /etc/ssl/rscmanager/privkey.pem;

    return 301 https://rscmanager.com$request_uri;
}

# ── Main HTTPS server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rscmanager.com;

    # ── SSL ───────────────────────────────────────────────
    ssl_certificate     /etc/ssl/rscmanager/fullchain.pem;
    ssl_certificate_key /etc/ssl/rscmanager/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/rscmanager/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Upload limit ──────────────────────────────────────
    client_max_body_size 25M;

    # ── Logging ───────────────────────────────────────────
    access_log /var/log/nginx/rscmanager.access.log;
    error_log  /var/log/nginx/rscmanager.error.log warn;

    # ── Gzip compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Auth endpoints: stricter rate limit ────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API reverse proxy ─────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (SignalR / live updates)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Don't buffer API responses
        proxy_buffering off;
    }

    # ── Swagger (REMOVE in hardened production) ───────────
    location /swagger {
        proxy_pass         http://127.0.0.1:8888;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check endpoint (no rate limit) ─────────────
    location = /api/health {
        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Everything else → Docker nginx (frontend SPA) ─────
    location / {
        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Block dot-files (except .well-known) ──────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
