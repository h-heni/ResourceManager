# ============================================
# ResourceManager - Production Docker Compose
# Optimized for 2GB Ubuntu VPS
# ============================================
# This configuration is specifically tuned for low-memory environments while
# maintaining production-grade reliability and security.
#
# MEMORY ALLOCATION (Total: ~2048MB available, ~1536MB allocated to containers):
#   - PostgreSQL:  512MB (max 768MB burst)
#   - Backend API: 768MB (max 1024MB burst)
#   - Redis:       128MB (max 192MB burst)
#   - Nginx Proxy: 64MB (max 128MB burst)
#   - Frontend:    64MB (max 128MB burst)
#   - System:      ~464MB remaining for OS/kernel/cache
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml logs -f api
#   docker compose -f docker-compose.prod.yml ps
#
# PREREQUISITES:
#   1. Copy .env.example to .env and configure all required values
#   2. Ensure Docker and Docker Compose are installed
#   3. Run: docker compose -f docker-compose.prod.yml config (validate syntax)
#
# ============================================

services:
  # ============================================
  # POSTGRESQL DATABASE
  # ============================================
  # Persistent data store for all application data.
  # Memory: 512MB soft limit, 768MB hard limit
  # Network: Isolated internal network (no external access)
  # Volume: Named volume for data persistence
  postgres_db:
    image: postgres:16-alpine
    container_name: rm-postgres
    
    # RESOURCE LIMITS - Critical for 2GB VPS
    # Memory limits prevent OOM (Out of Memory) killer from terminating processes
    deploy:
      resources:
        limits:
          cpus: '1.0'              # Max 1 CPU core
          memory: 768M             # Hard limit - container killed if exceeded
        reservations:
          cpus: '0.25'             # Guaranteed CPU allocation
          memory: 384M             # Guaranteed memory - prevents starvation
    
    # MEMORY TUNING for PostgreSQL
    # These settings optimize PostgreSQL for low-memory environments
    # shared_buffers: 128MB (25% of 512MB - PostgreSQL recommendation)
    # effective_cache_size: 384MB (75% of 512MB)
    # maintenance_work_mem: 64MB
    # work_mem: 4MB per connection
    # max_connections: 40 (reduced from default 100)
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c max_connections=40
    
    # ENVIRONMENT VARIABLES
    # All sensitive values must be provided via .env file
    environment:
      # Database configuration
      POSTGRES_DB: ${POSTGRES_DB:-resourcemanager}
      POSTGRES_USER: ${POSTGRES_USER:-rmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR - POSTGRES_PASSWORD must be set in .env file}
      
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      
      # Security - disable unnecessary features
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    
    # VOLUMES - Named volume for data persistence
    # Data persists across container restarts and recreations
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: custom PostgreSQL configuration
      # - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    
    # NETWORKING - Internal only, not exposed to host
    # Security: Database is only accessible from other containers
    networks:
      - backend-network
    
    # RESTART POLICY - Automatically restart on failure
    # unless-stopped: Restart always except when explicitly stopped
    restart: unless-stopped
    
    # HEALTH CHECK - Ensures database is ready before dependent services start
    # Services using depends_on with condition: service_healthy will wait
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmuser} -d ${POSTGRES_DB:-resourcemanager}"]
      interval: 10s          # Check every 10 seconds
      timeout: 5s            # Fail if check takes longer than 5s
      retries: 5             # Allow 5 failures before marking unhealthy
      start_period: 30s      # Grace period during startup
    
    # LOGGING - Prevents logs from consuming disk space
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB per log file
        max-file: "3"        # Keep max 3 rotated log files (30MB total)
    
    # SECURITY OPTIONS
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
    
    # Disable unnecessary features to reduce attack surface
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

  # ============================================
  # BACKEND API (.NET 8)
  # ============================================
  # Main application server handling business logic and API endpoints.
  # Memory: 768MB soft limit, 1024MB hard limit
  # Network: Connected to both backend (DB) and frontend networks
  api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    container_name: rm-api
    
    # BUILD CONFIGURATION - Only needed if building locally
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
      # cache_from:
      #   - ${API_IMAGE:-resourcemanager-api:latest}
    
    # RESOURCE LIMITS - Critical for 2GB VPS
    deploy:
      resources:
        limits:
          cpus: '1.5'              # Max 1.5 CPU cores (main workload)
          memory: 1024M            # Hard limit
        reservations:
          cpus: '0.5'              # Guaranteed CPU
          memory: 512M             # Guaranteed memory
    
    # No external port exposure — accessed via nginx reverse proxy
    expose:
      - "8080"
    
    # ENVIRONMENT VARIABLES - Application configuration
    environment:
      # ASP.NET Core configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
      # Database connection
      # Uses service name 'postgres_db' as hostname (Docker DNS resolution)
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?ERROR};SSL Mode=Prefer;Maximum Pool Size=20;Minimum Pool Size=2;Connection Idle Lifetime=60
      
      # JWT Authentication
      - Jwt__Key=${JWT_KEY:?ERROR - JWT_KEY must be set in .env file}
      - Jwt__Issuer=${JWT_ISSUER:-ResourceManager}
      - Jwt__Audience=${JWT_AUDIENCE:-ResourceManager-Users}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-60}
      
      # Google Integration (Gmail API for email sending)
      - GoogleOptions__ClientId=${GOOGLE_CLIENT_ID:-}
      - GoogleOptions__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - GoogleOptions__RefreshToken=${GOOGLE_REFRESH_TOKEN:-}
      
      # Supabase (if used for file storage)
      - Supabase__Url=${SUPABASE_URL:-}
      - Supabase__Key=${SUPABASE_KEY:-}
      
      # Redis Configuration
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?ERROR},abortConnect=false
      - Redis__InstanceName=ResourceManager_
      
      # CORS configuration
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_1:-http://localhost}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_2:-http://localhost:80}
      
      # Performance tuning for low memory
      - DOTNET_GCHeapCount=2
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=6
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      
      # Logging
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    
    # VOLUMES - Persistent storage for logs
    volumes:
      - api-logs:/app/Logs
      # Optional: Configuration overrides
      # - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    
    # DEPENDENCIES - Wait for database and Redis to be healthy before starting
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # NETWORKING
    networks:
      - backend-network   # Access to database
      - frontend-network  # Access from web/nginx
    
    # RESTART POLICY
    restart: unless-stopped
    
    # HEALTH CHECK - Verifies API is responding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s      # Allow time for .NET startup + DB migrations
    
    # LOGGING - Prevents disk space exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"        # 100MB total for API logs
    
    # SECURITY OPTIONS
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required to bind to port 8080

  # ============================================
  # FRONTEND (React + Nginx for static files)
  # ============================================
  # Serves static React build files.
  # Memory: 64MB soft limit, 128MB hard limit (Nginx is very lightweight)
  # Network: Internal only - accessed via nginx reverse proxy
  web:
    image: ${WEB_IMAGE:-resourcemanager-web:latest}
    container_name: rm-web
    
    # BUILD CONFIGURATION
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=                # Empty - nginx proxies /api to backend
    
    # RESOURCE LIMITS - Nginx is extremely lightweight
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # No external port exposure — accessed via nginx reverse proxy
    expose:
      - "80"
    
    # ENVIRONMENT (if needed for nginx templating)
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
      - BACKEND_API_HOST=api
      - BACKEND_API_PORT=8080
    
    # DEPENDENCIES - Wait for API to be healthy
    depends_on:
      api:
        condition: service_healthy
    
    # NETWORKING - Frontend network only (no direct DB access = security)
    networks:
      - frontend-network
    
    # RESTART POLICY
    restart: unless-stopped
    
    # HEALTH CHECK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # LOGGING
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # SECURITY OPTIONS
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

  # ============================================
  # REDIS CACHE
  # ============================================
  # In-memory cache for improved API performance.
  # Memory: 128MB limit with LRU eviction
  redis:
    image: redis:7-alpine
    container_name: rm-redis
    
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?ERROR - REDIS_PASSWORD must be set in .env file}
    
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    volumes:
      - redis_data:/data
    
    networks:
      - backend-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    
    security_opt:
      - no-new-privileges:true

  # ============================================
  # NGINX REVERSE PROXY (Production Entry Point)
  # ============================================
  # Main entry point for all traffic. Routes:
  #   / → React frontend (web container)
  #   /api → .NET backend (api container)
  # Memory: 64MB limit (Nginx is extremely lightweight)
  nginx:
    image: ${NGINX_IMAGE:-resourcemanager-nginx:latest}
    container_name: rm-nginx
    
    build:
      context: ./nginx
      dockerfile: Dockerfile
    
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Main entry point — only nginx is exposed to the host
    ports:
      - "${WEB_PORT:-80}:80"
      # For HTTPS (after SSL setup):
      # - "${WEB_PORT_SSL:-443}:443"
    
    volumes:
      # For Let's Encrypt certificates (uncomment after SSL setup):
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
      - nginx-logs:/var/log/nginx
    
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    
    # Nginx needs access to both frontend and backend networks
    networks:
      - frontend-network
      - backend-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

# ============================================
# NAMED VOLUMES
# ============================================
# Persistent storage that survives container recreation.
# Data is stored in /var/lib/docker/volumes/ on the host.
# To backup: docker run --rm -v postgres_data:/data -v $(pwd):/backup alpine tar czf /backup/postgres-backup.tar.gz /data
volumes:
  # PostgreSQL data - CRITICAL - Do not delete or data will be lost
  postgres_data:
    driver: local
  
  # API logs - Can be safely deleted if disk space is needed
  api-logs:
    driver: local
  
  # Redis persistent data
  redis_data:
    driver: local
  
  # Nginx access and error logs
  nginx-logs:
    driver: local

# ============================================
# NETWORKS
# ============================================
# Network isolation improves security by limiting communication paths.
# - backend-network: Database ↔ API only
# - frontend-network: Web ↔ API only
# Result: Web cannot directly access Database (defense in depth)
networks:
  # Backend network - Internal only
  backend-network:
    driver: bridge
    internal: false           # Set to true for complete isolation (blocks internet access)
    driver_opts:
      com.docker.network.bridge.name: rm-backend
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
    # labels:
    #   com.resourcemanager.description: "Backend network for API-Database communication"
  
  # Frontend network - Internet-facing
  frontend-network:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.name: rm-frontend
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/24
    # labels:
    #   com.resourcemanager.description: "Frontend network for Web-API communication"

# ============================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================
#
# 1. SECURITY CHECKLIST:
#    [ ] Change all default passwords in .env
#    [ ] Generate strong JWT_KEY (min 32 characters): openssl rand -base64 48
#    [ ] Set POSTGRES_PASSWORD to a strong value
#    [ ] Review CORS_ORIGIN values
#    [ ] Consider enabling SSL/TLS (HTTPS)
#    [ ] Set up firewall rules (UFW): allow only 80, 443, 22
#    [ ] Disable Swagger in production (remove swagger endpoint from nginx.conf)
#    [ ] Enable internal: true for backend-network if internet not needed
#
# 2. PERFORMANCE TUNING:
#    [ ] Monitor memory usage: docker stats
#    [ ] Adjust memory limits based on actual usage
#    [ ] Consider adding Redis for caching if needed (50-100MB)
#    [ ] Enable PostgreSQL query logging if debugging performance
#    [ ] Review nginx access logs for slow endpoints
#
# 3. BACKUP STRATEGY:
#    [ ] Daily backup of postgres_data volume
#    [ ] Store backups off-server (S3, external storage)
#    [ ] Test restore procedure regularly
#    [ ] Consider pg_dump for logical backups
#
# 4. MONITORING:
#    [ ] Set up external monitoring (uptime, response time)
#    [ ] Configure log aggregation (Loki, ELK)
#    [ ] Set up alerts for container restarts
#    [ ] Monitor disk space usage
#    [ ] Track memory/CPU usage trends
#
# 5. MAINTENANCE:
#    [ ] Regularly update Docker images (security patches)
#    [ ] Review logs for errors: docker compose -f docker-compose.prod.yml logs --tail=100
#    [ ] Prune unused Docker resources: docker system prune -a --volumes
#    [ ] Rotate log files if they grow too large
#
# 6. SCALING (if upgrading VPS):
#    - 4GB VPS: Double all memory limits
#    - 8GB VPS: Add Redis (256MB), increase PostgreSQL to 1.5GB
#    - Multiple containers: Use Docker Swarm or Kubernetes
#
# ============================================
