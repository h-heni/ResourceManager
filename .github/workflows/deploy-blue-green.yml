# ============================================
# ResourceManager - Blue-Green Deployment Workflow
# ============================================
# Triggers on push to main branch or manual workflow dispatch.
# Builds & pushes Docker images to GitHub Container Registry,
# then SSHs into the VPS to perform Blue-Green deployment.
#
# Required GitHub Secrets:
#   VPS_HOST          - Server IP or hostname
#   VPS_USER          - SSH username (e.g. deploy)
#   SSH_PRIVATE_KEY   - Private key for SSH authentication
#
# Required GitHub Variables (Settings > Variables):
#   DEPLOY_PATH       - (optional) Path on VPS, defaults to /opt/resourcemanager
# ============================================

name: Deploy Blue-Green to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-web

jobs:
  # ============================================
  # 1. Build & Push Docker Images to GHCR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Image ---
      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend Image ---
      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 2. Deploy to VPS with Blue-Green Strategy
  # ============================================
  deploy:
    name: Blue-Green Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code (for deployment files)
        uses: actions/checkout@v4

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.blue-green.yml,nginx/blue-green.conf,scripts/deploy-blue-green.sh,scripts/rollback-blue-green.sh"
          target: ${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}

      - name: SSH into VPS and run Blue-Green deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE: ${{ env.API_IMAGE }}:latest
          WEB_IMAGE: ${{ env.WEB_IMAGE }}:latest
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: API_IMAGE,WEB_IMAGE,REGISTRY
          script: |
            set -e
            DEPLOY_DIR="${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}"
            cd "$DEPLOY_DIR"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Blue-Green Deployment Starting"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo "--- Logging in to GHCR ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "--- Updating image names in .env ---"
            # Append/update image names in .env (create if missing)
            grep -q "^API_IMAGE=" .env 2>/dev/null && sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" .env || echo "API_IMAGE=${API_IMAGE}" >> .env
            grep -q "^WEB_IMAGE=" .env 2>/dev/null && sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env || echo "WEB_IMAGE=${WEB_IMAGE}" >> .env

            echo "--- Making scripts executable ---"
            chmod +x scripts/deploy-blue-green.sh
            chmod +x scripts/rollback-blue-green.sh

            echo "--- Running Blue-Green deployment script ---"
            ./scripts/deploy-blue-green.sh

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Blue-Green Deployment Completed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ============================================
      # 3. Post-Deployment Verification
      # ============================================
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "--- Verifying deployment ---"
            curl -f http://localhost/health || exit 1
            curl -f http://localhost/api/health || exit 1
            echo "✅ Deployment verification successful"

  # ============================================
  # 4. Rollback on Failure (Manual)
  # ============================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production
    permissions: {}

    steps:
      - name: SSH into VPS and rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}"
            cd "$DEPLOY_DIR"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚠️  Deployment Failed - Initiating Rollback"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ -f scripts/rollback-blue-green.sh ]; then
              chmod +x scripts/rollback-blue-green.sh
              # Auto-confirm rollback in CI environment
              yes | ./scripts/rollback-blue-green.sh || echo "Rollback script executed"
            else
              echo "Rollback script not found. Manual intervention required."
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Rollback Completed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"