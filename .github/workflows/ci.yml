# ============================================
# ResourceManager - CI/CD Pipeline
# ============================================
# Single unified pipeline:
#   push to main → build & test → Docker build → deploy to VPS
#
# On 'dev' branch or PRs: build & test only (no deploy).
# On 'main' branch push : build → test → Docker → auto-deploy.
#
# ┌────────────────────────────────────────────────────────┐
# │  push main ──► backend tests ──► frontend build        │
# │                      │                  │              │
# │                      └──────┬───────────┘              │
# │                             ▼                          │
# │                    Docker build & push (GHCR)          │
# │                             │                          │
# │                             ▼                          │
# │              SSH to VPS → deploy-blue-green.sh         │
# │              (sequential swap, ~10-15s downtime)       │
# │              (DB migrations auto-applied at startup)   │
# │                             │                          │
# │                             ▼                          │
# │                    Health check verification           │
# │                             │                          │
# │                        ┌────┴────┐                     │
# │                        │ Fail?   │                     │
# │                        └────┬────┘                     │
# │                             ▼                          │
# │                    Auto rollback on failure             │
# └────────────────────────────────────────────────────────┘
#
# Required GitHub Secrets:
#   VPS_HOST        - VPS IP address or hostname
#   VPS_USER        - SSH username (e.g. deploy or root)
#   SSH_PRIVATE_KEY - Private key for SSH authentication
#
# Optional GitHub Variables (Settings > Variables > Actions):
#   DEPLOY_PATH     - Deployment directory (default: /opt/resourcemanager)
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-web
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}

jobs:
  # ============================================
  # 1. Backend Build & Test
  # ============================================
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore ResourceManager.API.csproj
          dotnet restore ResourceManager.Domain/ResourceManager.Domain.csproj
          dotnet restore ResourceManager.Application/ResourceManager.Application.csproj
          dotnet restore ResourceManager.Infrastructure/ResourceManager.Infrastructure.csproj
          dotnet restore ResourceManager.Tests/ResourceManager.Tests.csproj

      - name: Build projects
        run: |
          dotnet build ResourceManager.Domain/ResourceManager.Domain.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Application/ResourceManager.Application.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Infrastructure/ResourceManager.Infrastructure.csproj --configuration Release --no-restore
          dotnet build ResourceManager.API.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Tests/ResourceManager.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ResourceManager.Tests/ResourceManager.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # ============================================
  # 2. Frontend Build & Lint
  # ============================================
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ''

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ClientApp/dist

  # ============================================
  # 3. Docker Build & Push (main branch only)
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================
  # 4. Deploy to VPS (auto on main push)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.blue-green.yml
            nginx/blue-green.conf
            nginx/rscmanager.conf
            scripts/deploy-blue-green.sh
            scripts/rollback-blue-green.sh

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.blue-green.yml,nginx/blue-green.conf,nginx/rscmanager.conf,scripts/deploy-blue-green.sh,scripts/rollback-blue-green.sh"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy Nginx site config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_PATH }}"
            NGINX_SRC="$DEPLOY_DIR/nginx/rscmanager.conf"

            if [ -f "$NGINX_SRC" ]; then
              echo "━━━ Deploying Nginx site config ━━━"
              sudo cp "$NGINX_SRC" /etc/nginx/sites-available/rscmanager.conf
              sudo ln -sf /etc/nginx/sites-available/rscmanager.conf /etc/nginx/sites-enabled/rscmanager.conf
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && sudo systemctl reload nginx
              echo "Nginx config deployed and reloaded"
            else
              echo "No rscmanager.conf found — skipping Nginx update"
            fi

      - name: Deploy via SSH (blue-green sequential swap)
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMG: ${{ env.API_IMAGE }}:latest
          WEB_IMG: ${{ env.WEB_IMAGE }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: API_IMG,WEB_IMG
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_PATH }}"
            cd "$DEPLOY_DIR"

            echo "━━━ Deployment starting ━━━"

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Update image names in .env
            grep -q "^API_IMAGE=" .env 2>/dev/null && sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMG}|" .env || echo "API_IMAGE=${API_IMG}" >> .env
            grep -q "^WEB_IMAGE=" .env 2>/dev/null && sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMG}|" .env || echo "WEB_IMAGE=${WEB_IMG}" >> .env

            # Make scripts executable
            chmod +x scripts/deploy-blue-green.sh
            chmod +x scripts/rollback-blue-green.sh 2>/dev/null || true

            # Run blue-green deployment (handles migration, health checks, rollback)
            ./scripts/deploy-blue-green.sh

            echo "━━━ Deployment complete ━━━"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Verifying deployment (with retries)..."
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if curl -f -s -o /dev/null http://localhost/health; then
                HEALTHY=true
                echo "Nginx health OK on attempt $i"
                break
              fi
              echo "Attempt $i/5: waiting for nginx..."
              sleep 5
            done
            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Nginx health check failed after 5 attempts"
              exit 1
            fi
            curl -f http://localhost/api/health || exit 1
            echo "Deployment verified OK"

  # ============================================
  # 5. Auto-Rollback on Failure
  # ============================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            echo "Deployment failed — rolling back..."
            if [ -f scripts/rollback-blue-green.sh ]; then
              chmod +x scripts/rollback-blue-green.sh
              yes | ./scripts/rollback-blue-green.sh || true
            fi
            echo "Rollback complete"
