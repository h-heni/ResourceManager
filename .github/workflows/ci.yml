name: CI/CD Pipeline

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ============================================
  # Backend Build & Test
  # ============================================
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore ResourceManager.API.csproj
          dotnet restore ResourceManager.Domain/ResourceManager.Domain.csproj
          dotnet restore ResourceManager.Application/ResourceManager.Application.csproj
          dotnet restore ResourceManager.Infrastructure/ResourceManager.Infrastructure.csproj
          dotnet restore ResourceManager.Tests/ResourceManager.Tests.csproj

      - name: Build projects (excluding Mobile)
        run: |
          dotnet build ResourceManager.Domain/ResourceManager.Domain.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Application/ResourceManager.Application.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Infrastructure/ResourceManager.Infrastructure.csproj --configuration Release --no-restore
          dotnet build ResourceManager.API.csproj --configuration Release --no-restore
          dotnet build ResourceManager.Tests/ResourceManager.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ResourceManager.Tests/ResourceManager.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # ============================================
  # Frontend Build & Lint
  # ============================================
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ClientApp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://localhost:7175' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ClientApp/dist

  # ============================================
  # Docker Build & Push (on main/staging only)
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine environment and tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi
          # Generate version tag from commit SHA (short)
          echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Backend image
      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resourcemanager-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/resourcemanager-api:${{ steps.meta.outputs.version }}
          build-args: |
            ENVIRONMENT=${{ steps.meta.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Build and push Frontend image
      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resourcemanager-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/resourcemanager-web:${{ steps.meta.outputs.version }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Security scanning
      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/resourcemanager-api:${{ steps.meta.outputs.tag }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/resourcemanager-web:${{ steps.meta.outputs.tag }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '.'
        continue-on-error: true

  # ============================================
  # Deployment is automatically triggered via workflow_run
  # in deploy.yml when CI completes successfully on main/staging
  # ============================================
