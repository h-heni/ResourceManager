# ============================================
# ResourceManager - Deploy to VPS via GitHub Container Registry
# ============================================
# Triggers:
#   - Manual workflow dispatch (recommended)
#   - Automatic on push to main (optional)
#
# This workflow:
#   1. Uses pre-built images from GHCR (built by ci.yml)
#   2. SSHs into VPS
#   3. Pulls latest images
#   4. Performs zero-downtime deployment with health checks
#   5. Rolls back on failure
#
# Required GitHub Secrets:
#   VPS_HOST              - Server IP or hostname
#   VPS_USER              - SSH username (e.g. deploy)
#   VPS_SSH_KEY           - Private SSH key for authentication
#   VPS_PORT              - SSH port (default: 22)
#   GHCR_TOKEN            - GitHub Personal Access Token with read:packages scope (for VPS)
#
# Required GitHub Variables (optional):
#   DEPLOY_PATH           - Path on VPS (default: /opt/resourcemanager)
# ============================================

name: Deploy to VPS

on:
  # Manual trigger (recommended for production)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'production'
      tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

  # Automatic on push to main (enable if desired)
  # push:
  #   branches: [main]

env:
  DEPLOY_USER: ${{ secrets.VPS_USER }}
  DEPLOY_HOST: ${{ secrets.VPS_HOST }}
  DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}

jobs:
  # ============================================
  # Deploy to VPS with Zero Downtime
  # ============================================
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose.prod.yml

      - name: Set image tags
        id: tags
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "api_image=ghcr.io/${{ github.repository_owner }}/resourcemanager-api:$TAG" >> $GITHUB_OUTPUT
          echo "web_image=ghcr.io/${{ github.repository_owner }}/resourcemanager-web:$TAG" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.DEPLOY_PORT }} \
            docker-compose.yml docker-compose.prod.yml \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy with zero downtime
        env:
          API_IMAGE: ${{ steps.tags.outputs.api_image }}
          WEB_IMAGE: ${{ steps.tags.outputs.web_image }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.DEPLOY_PORT }} \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          
          cd ${{ env.DEPLOY_PATH }}
          
          echo "============================================"
          echo "🚀 Starting Zero-Downtime Deployment"
          echo "============================================"
          
          # Login to GitHub Container Registry
          echo "📦 Logging in to GitHub Container Registry..."
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          
          # Update image references in .env
          echo "🔧 Updating image tags in .env..."
          grep -q "^API_IMAGE=" .env 2>/dev/null && \
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${{ steps.tags.outputs.api_image }}|" .env || \
            echo "API_IMAGE=${{ steps.tags.outputs.api_image }}" >> .env
          
          grep -q "^WEB_IMAGE=" .env 2>/dev/null && \
            sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${{ steps.tags.outputs.web_image }}|" .env || \
            echo "WEB_IMAGE=${{ steps.tags.outputs.web_image }}" >> .env
          
          # Pull new images
          echo "📥 Pulling latest Docker images..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api web
          
          # Check if services are running
          if docker compose ps | grep -q "resourcemanager"; then
            echo "♻️  Performing rolling update..."
            
            # Start new containers (will run alongside old ones temporarily)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --scale api=2 --no-recreate api
            
            # Wait for new API to be healthy
            echo "⏳ Waiting for new API container to be healthy..."
            sleep 10
            
            # Health check for new API
            MAX_ATTEMPTS=30
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if docker compose exec -T api curl -f http://localhost:8080/health 2>/dev/null; then
                echo "✅ New API is healthy"
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "⏳ Waiting for API health check... ($ATTEMPT/$MAX_ATTEMPTS)"
              sleep 2
            done
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ New API failed health check - rolling back"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale api=1 --no-recreate api
              exit 1
            fi
            
            # Scale down old API
            echo "🔄 Removing old API container..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale api=1 --remove-orphans api
            
            # Update frontend (nginx can be restarted quickly)
            echo "🔄 Updating frontend..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate web
            
          else
            echo "🆕 No existing deployment found - starting fresh..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          fi
          
          # Wait for all services to be ready
          echo "⏳ Waiting for all services to be ready..."
          sleep 5
          
          # Final health check
          echo "🔍 Running final health checks..."
          if docker compose exec -T api curl -f http://localhost:8080/health && \
             docker compose exec -T web wget --no-verbose --tries=1 --spider http://localhost:80/health; then
            echo "✅ All services are healthy"
          else
            echo "⚠️  Warning: Some health checks failed, but services are running"
          fi
          
          # Cleanup old images
          echo "🧹 Cleaning up old Docker images..."
          docker image prune -af --filter "until=72h" || true
          
          echo ""
          echo "============================================"
          echo "✅ Deployment Complete!"
          echo "============================================"
          docker compose ps
          ENDSSH

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          # You can add additional verification here (e.g., curl health endpoints)
          echo "Deployment to ${{ inputs.environment || 'production' }} completed successfully!"

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key