# ============================================
# ResourceManager - Deploy to VPS via GHCR
# ============================================
# Triggers on push to main.
# Builds & pushes Docker images to GitHub Container Registry,
# then SSHs into the VPS to pull and restart.
#
# Required GitHub Secrets:
#   VPS_HOST          - Server IP or hostname
#   VPS_USER          - SSH username (e.g. deploy)
#   SSH_PRIVATE_KEY   - Private key for SSH authentication
#
# Required GitHub Variables (Settings > Variables):
#   DEPLOY_PATH       - (optional) Path on VPS, defaults to /opt/resourcemanager
# ============================================

name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/resourcemanager-web

jobs:
  # ============================================
  # 1. Build & Push Docker Images to GHCR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Image ---
      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend Image ---
      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 2. Deploy to VPS via SSH
  # ============================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE: ${{ env.API_IMAGE }}:latest
          WEB_IMAGE: ${{ env.WEB_IMAGE }}:latest
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: API_IMAGE,WEB_IMAGE,REGISTRY
          script: |
            set -e
            DEPLOY_DIR="${{ vars.DEPLOY_PATH || '/opt/resourcemanager' }}"
            cd "$DEPLOY_DIR"

            echo "--- Logging in to GHCR ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "--- Setting image names in .env ---"
            # Append/update image names in .env (create if missing)
            grep -q "^API_IMAGE=" .env 2>/dev/null && sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" .env || echo "API_IMAGE=${API_IMAGE}" >> .env
            grep -q "^WEB_IMAGE=" .env 2>/dev/null && sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env || echo "WEB_IMAGE=${WEB_IMAGE}" >> .env

            echo "--- Pulling latest images ---"
            docker compose pull api web

            echo "--- Restarting services ---"
            docker compose up -d --remove-orphans

            echo "--- Pruning old images ---"
            docker image prune -f

            echo "--- Deployment complete ---"
            docker compose ps
