# ============================================
# ResourceManager - Blue-Green Deployment (2GB VPS)
# ============================================
# Sequential swap strategy: only ONE environment runs at a time.
# During deployment: stop old → start new (~10-15s downtime).
#
# Memory budget (2GB total):
#   PostgreSQL:     ~384MB  (limit 512MB)
#   Redis:          ~96MB   (limit 128MB)
#   API:            ~384MB  (limit 512MB)
#   Web (Nginx):    ~32MB   (limit 64MB)
#   Nginx proxy:    ~32MB   (limit 64MB)
#   System/OS:      ~500MB
#   Total:          ~1.4GB used, ~600MB headroom
#
# Usage:
#   # Initial deploy (Blue)
#   docker compose -f docker-compose.blue-green.yml up -d postgres_db redis blue-api blue-web nginx
#
#   # Subsequent deploys (automated via scripts/deploy-blue-green.sh)
#   ./scripts/deploy-blue-green.sh
#
# IMPORTANT: Create .env file from .env.example first!
# ============================================

services:
  # ============================================
  # PostgreSQL Database (Shared — always running)
  # ============================================
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resourcemanager}
      POSTGRES_USER: ${POSTGRES_USER:-rmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c max_wal_size=256MB
      -c min_wal_size=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmuser} -d ${POSTGRES_DB:-resourcemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ============================================
  # Redis Cache (Shared — always running)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rm-redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================
  # BLUE ENVIRONMENT
  # ============================================

  blue-api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    container_name: blue-api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "7175:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer;Maximum Pool Size=20;Minimum Pool Size=2;Connection Idle Lifetime=60
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-ResourceManager}
      - Jwt__Audience=${JWT_AUDIENCE:-ResourceManager-Users}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-60}
      - GoogleOptions__ClientId=${GOOGLE_CLIENT_ID:-}
      - GoogleOptions__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - GoogleOptions__RefreshToken=${GOOGLE_REFRESH_TOKEN:-}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?err},abortConnect=false
      - Redis__InstanceName=ResourceManager_
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_1:-http://localhost}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_2:-http://localhost:80}
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - DOTNET_GCHeapCount=2
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - DEPLOYMENT_ENV=blue
    volumes:
      - blue-api-logs:/app/Logs
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  blue-web:
    image: ${WEB_IMAGE:-resourcemanager-web:latest}
    container_name: blue-web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - "8080:80"
    environment:
      - BACKEND_API_HOST=blue-api
      - BACKEND_API_PORT=8080
      - DEPLOYMENT_ENV=blue
    depends_on:
      blue-api:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================
  # GREEN ENVIRONMENT
  # ============================================

  green-api:
    image: ${API_IMAGE:-resourcemanager-api:latest}
    container_name: green-api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "7176:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-resourcemanager};Username=${POSTGRES_USER:-rmuser};Password=${POSTGRES_PASSWORD:?err};SSL Mode=Prefer;Maximum Pool Size=20;Minimum Pool Size=2;Connection Idle Lifetime=60
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-ResourceManager}
      - Jwt__Audience=${JWT_AUDIENCE:-ResourceManager-Users}
      - Jwt__TokenExpirationInMinutes=${JWT_EXPIRATION:-60}
      - GoogleOptions__ClientId=${GOOGLE_CLIENT_ID:-}
      - GoogleOptions__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - GoogleOptions__RefreshToken=${GOOGLE_REFRESH_TOKEN:-}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?err},abortConnect=false
      - Redis__InstanceName=ResourceManager_
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_1:-http://localhost}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_2:-http://localhost:80}
      - DOTNET_gcServer=0
      - DOTNET_GCConserveMemory=9
      - DOTNET_GCHeapCount=2
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - DEPLOYMENT_ENV=green
    volumes:
      - green-api-logs:/app/Logs
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  green-web:
    image: ${WEB_IMAGE:-resourcemanager-web:latest}
    container_name: green-web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - "8081:80"
    environment:
      - BACKEND_API_HOST=green-api
      - BACKEND_API_PORT=8080
      - DEPLOYMENT_ENV=green
    depends_on:
      green-api:
        condition: service_healthy
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================
  # Nginx Reverse Proxy (always running)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/blue-green.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - ACTIVE_ENV=${ACTIVE_ENV:-blue}
    networks:
      - rm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: /bin/sh -c "envsubst '$$ACTIVE_ENV' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  blue-api-logs:
    driver: local
  green-api-logs:
    driver: local

networks:
  rm-internal:
    driver: bridge
