# ============================================
# ResourceManager - Docker Compose (CI/CD)
# ============================================
# Used by GitHub Actions for integration testing
# Usage: docker-compose -f docker-compose.ci.yml up --build --abort-on-container-exit
# ============================================

services:
  # ============================================
  # Backend API (.NET 8)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ResourceManager-api-ci
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:8080
      # Use test/mock values for CI
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=localhost;Database=test;Username=test;Password=test}
      - Jwt__Key=${JWT_KEY:-CI_TEST_KEY_32_CHARACTERS_LONG!!}
      - Jwt__Issuer=ResourceManager-CI
      - Jwt__Audience=ResourceManager-CI-Users
      - Jwt__TokenExpirationInMinutes=60
      - Supabase__Url=${SUPABASE_URL:-https://test.supabase.co}
      - Supabase__Key=${SUPABASE_KEY:-test-key}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-test}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-test}
      - Google__RefreshToken=${GOOGLE_REFRESH_TOKEN:-test}
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Frontend (React + Vite + Nginx)
  # ============================================
  web:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://api:8080
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-test}
    container_name: ResourceManager-web-ci
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ci-network:
    driver: bridge
