[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-xml-generator"
version = "1.0.0"
description = "Compliant XML invoice generators for Tunisia (TEIF), KSA (ZATCA), and EU (Peppol BIS 3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No external dependencies — stdlib only (xml, base64, hashlib, decimal, dataclasses, json)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["invoice_xml_generator*"]

[tool.pytest.ini_options]
testpaths = ["invoice_xml_generator/tests"]
